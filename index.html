    // 初始化縮圖網址
    stopsData.forEach(s => {
      s.photos.forEach(p => {
        p.thumbnailUrl = `https://drive.google.com/thumbnail?id=${p.id}&sz=w800`;
      });
    });

    let currentFilter = 'ALL';
    let markers = {};
    let map;
    const svgFallback = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200' fill='%23e2e8f0'><rect width='300' height='200'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%2364748b' font-size='14'>風獅爺相片</text></svg>";

    function initMap() {
      map = L.map('map').setView([24.448, 118.375], 12);

      // Google Maps 道路圖
      const googleRoads = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20, subdomains: ['0', '1', '2', '3'], attribution: '© Google Maps'
      });
      // OpenStreetMap (OSM)
      const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap contributors'
      });
      // Google Maps 衛星混合圖
      const googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20, subdomains: ['0', '1', '2', '3'], attribution: '© Google Maps Satellite'
      });
      // 臺灣通用電子地圖 (NLSC)
      const nlscEmap = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/EPSG:3857/{z}/{y}/{x}', {
        maxZoom: 20, attribution: '© 國土測繪圖資服務雲'
      });
      // CartoDB 全彩地圖
      const cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd', attribution: '© CARTO'
      });

      googleRoads.addTo(map);

      // 地圖底圖切換：支援 Google Maps 與 OpenStreetMap (OSM)
      const baseMaps = {
        "🗺️ Google Maps 道路圖": googleRoads,
        "🌍 OpenStreetMap (OSM)": osmStandard,
        "🛰️ Google Maps 衛星圖": googleHybrid,
        "🇹🇼 臺灣通用電子地圖 (NLSC)": nlscEmap,
        "🎨 CartoDB 全彩圖": cartoVoyager
      };

      L.control.layers(baseMaps, null, { position: 'topright', collapsed: false }).addTo(map);

      renderMarkers();
      renderList();
      updateCounts();
    }

        // 根據站點編號 (1~30) 計算連續彩虹漸層色
    function getRainbowColor(num, total = 30) {
      const hue = Math.round(((num - 1) / (total - 1)) * 315);
      return `hsl(${hue}, 88%, 45%)`;
    }

    function createNumberedIcon(num) {
      const color = getRainbowColor(num);
      return L.divIcon({
        className: 'custom-pin',
        html: `<div class="numbered-pin" style="background-color: ${color};"><span class="pin-label">${num}</span></div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });
    }

    function renderMarkers() {
      for (let id in markers) { map.removeLayer(markers[id]); }
      markers = {};

      stopsData.forEach(stop => {
        if (stop.lat && stop.lng) {
          if (currentFilter !== 'ALL' && stop.date !== currentFilter) return;

          const marker = L.marker([stop.lat, stop.lng], { icon: createNumberedIcon(stop.stop_id) }).addTo(map);
          const firstPhoto = stop.photos[0];
          const imgUrl = firstPhoto.localUrl || firstPhoto.thumbnailUrl;

          let galleryHtml = '';
          if (stop.photos.length > 1) {
            galleryHtml = '<div class="popup-gallery">' + stop.photos.map((p, pIdx) => `
              <img class="gallery-img" src="${p.localUrl || p.thumbnailUrl}" onerror="this.src='${svgFallback}'" 
                   onclick="document.getElementById('main-img-${stop.stop_id}').src=this.src" title="相片 ${pIdx + 1}: ${p.time}">
            `).join('') + '</div>';
          }

          const popupContent = `
            <div class="popup-box">
              <div class="popup-header">
                <div class="popup-title" style="color: ${getRainbowColor(stop.stop_id)}; font-weight: 700;">${stop.stop_number} ${stop.name}</div>
                <div class="popup-badge" style="background: ${getRainbowColor(stop.stop_id)}1a; color: ${getRainbowColor(stop.stop_id)}; border: 1px solid ${getRainbowColor(stop.stop_id)}40;">${stop.photo_count} 張照片</div>
              </div>
              <div class="popup-meta">
                <div><i class="fa-regular fa-clock"></i> <strong>拍攝時間：</strong>${stop.date} ${stop.time_display}</div>
                <div><i class="fa-solid fa-location-dot"></i> <strong>地點：</strong>${stop.location}</div>
              </div>
              <img id="main-img-${stop.stop_id}" class="popup-main-img" src="${imgUrl}" onerror="this.src='${svgFallback}'" alt="${stop.name}">
              ${galleryHtml}
              <div class="popup-actions">
                <a href="https://www.google.com/maps/search/?api=1&query=${stop.lat},${stop.lng}" target="_blank" class="popup-link" style="background:#ea4335;" title="在 Google Maps 查看此座標地標">
                  <i class="fa-solid fa-map-location-dot"></i> Google Maps
                </a>
                <a href="https://www.openstreetmap.org/?mlat=${stop.lat}&mlon=${stop.lng}#map=18/${stop.lat}/${stop.lng}" target="_blank" class="popup-link" style="background:#059669;" title="在 OpenStreetMap 查看此座標地標">
                  <i class="fa-regular fa-map"></i> OSM
                </a>
                <a href="${firstPhoto.viewUrl}" target="_blank" class="popup-link" title="開啟 Google Drive 雲端原圖">
                  <i class="fa-brands fa-google-drive"></i> 原圖
                </a>
              </div>
            </div>
          `;

          marker.bindPopup(popupContent, { maxWidth: 300 });
          marker.on('click', () => highlightCard(stop.stop_id));
          markers[stop.stop_id] = marker;
        }
      });
    }

    function renderList() {
      const listEl = document.getElementById('stopsList');
      listEl.innerHTML = '';
      const filtered = stopsData.filter(s => currentFilter === 'ALL' || s.date === currentFilter);

      filtered.forEach(stop => {
        const card = document.createElement('div');
        card.className = `stop-card ${stop.lat ? 'has-pin' : ''}`;
        card.id = `stop-card-${stop.stop_id}`;
        card.onclick = () => focusStop(stop);

        const firstPhoto = stop.photos[0];
        const thumbUrl = firstPhoto.localUrl || firstPhoto.thumbnailUrl;

        const badgeHtml = stop.lat 
          ? `<span class="badge-status status-pinned"><i class="fa-solid fa-location-dot"></i> 已定位</span>`
          : `<span class="badge-status status-wait"><i class="fa-regular fa-clock"></i> 待定位</span>`;

        card.innerHTML = `
          <div class="stop-num-badge" style="background: ${getRainbowColor(stop.stop_id)};">${stop.stop_number}</div>
          <div class="stop-thumb-box">
            <img class="stop-thumb" src="${thumbUrl}" onerror="this.src='${svgFallback}'" alt="thumb">
            <div class="stop-photo-count"><i class="fa-solid fa-images"></i> ${stop.photo_count}</div>
          </div>
          <div class="stop-details">
            <div class="stop-name">${stop.name}</div>
            <div class="stop-time"><i class="fa-regular fa-clock"></i> ${stop.date} ${stop.time_display}</div>
            <div class="stop-loc">${stop.lat ? '<i class="fa-solid fa-map-pin"></i> ' + stop.location : badgeHtml}</div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function focusStop(stop) {
      highlightCard(stop.stop_id);
      if (stop.lat && stop.lng && markers[stop.stop_id]) {
        map.flyTo([stop.lat, stop.lng], 16, { duration: 1 });
        markers[stop.stop_id].openPopup();
      } else {
        alert(`【${stop.stop_number} ${stop.name}】\n拍攝時間：${stop.date} ${stop.time_display}\n內含 ${stop.photo_count} 張相片。\n尚未載入 GPS 座標。請點擊上方按鈕選取照片資料夾，系統將讀取 EXIF 自動在地圖上插上旗標！`);
      }
    }

    function highlightCard(stopId) {
      document.querySelectorAll('.stop-card').forEach(c => {
        c.classList.remove('active');
        c.style.borderColor = '';
        c.style.backgroundColor = '';
      });
      const card = document.getElementById(`stop-card-${stopId}`);
      if (card) {
        const color = getRainbowColor(stopId);
        card.classList.add('active');
        card.style.borderColor = color;
        card.style.backgroundColor = color + '0d';
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMarkers();
      renderList();
    }

    function updateCounts() {
      let pinnedCount = 0;
      stopsData.forEach(s => { if (s.lat && s.lng) pinnedCount++; });
      document.getElementById('pinned-count').innerText = pinnedCount;
    }

    // 自動讀取照片 EXIF 並自動將相近的相片整合至該站旗標
    async function handleFiles(files) {
      let matchedCount = 0;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        for (let stop of stopsData) {
          const photoMatch = stop.photos.find(p => p.title === file.name);
          if (photoMatch) {
            photoMatch.localUrl = URL.createObjectURL(file);
            try {
              const exif = await exifr.parse(file, ['latitude', 'longitude', 'DateTimeOriginal']);
              if (exif && exif.latitude && exif.longitude) {
                stop.lat = exif.latitude;
                stop.lng = exif.longitude;
                stop.location = `座標: ${exif.latitude.toFixed(5)}, ${exif.longitude.toFixed(5)}`;
              }
            } catch (e) {
              console.error(e);
            }
            matchedCount++;
          }
        }
      }
      alert(`已成功匹配 ${matchedCount} 張相片！相近時間與 GPS 的照片已自動整合成同一個風獅爺標籤，並按時序完成編號。`);
      renderMarkers();
      renderList();
      updateCounts();

      const group = Object.values(markers);
      if (group.length > 0) {
        const fg = L.featureGroup(group);
        map.fitBounds(fg.getBounds().pad(0.1));
      }
    }

    function exportGeoJSON() {
      const geojson = {
        type: "FeatureCollection",
        features: stopsData.filter(s => s.lat && s.lng).map(s => ({
          type: "Feature",
          geometry: { type: "Point", coordinates: [s.lng, s.lat] },
          properties: {
            stop_id: s.stop_id,
            stop_number: s.stop_number,
            name: s.name,
            date: s.date,
            time_display: s.time_display,
            location: s.location,
            photo_count: s.photo_count,
            photos: s.photos.map(p => ({ title: p.title, time: p.time, viewUrl: p.viewUrl }))
          }
        }))
      };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kinmen_wind_lion_stops.geojson';
      a.click();
    }

    const dropArea = document.getElementById('dropArea');
    const dropOverlay = document.getElementById('dropOverlay');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.style.display = 'flex'; });
    dropOverlay.addEventListener('dragleave', (e) => { dropOverlay.style.display = 'none'; });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.style.display = 'none';
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFiles(e.dataTransfer.files);
      }
    });

    window.onload = initMap;
  </script>
</body>
</html>
