    function haversineM(lat1, lng1, lat2, lng2) {
      const R = 6371000, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }
    function isPlaceholderName(name) { return /^第\s*\d+\s*站/.test(name || ''); }
    function cleanBase(s) {
      return (s || '').replace(/(鄉|鎮|市|縣|村|里|路|街|段|巷|弄|號).*$/, m => m.length <= 2 ? m : m).trim()
        .replace(/^[^\u4e00-\u9fa5a-zA-Z0-9]+|[^\u4e00-\u9fa5a-zA-Z0-9]+$/g, '');
    }
    // 全站唯一性保證：重複時依序加 方位 → 之二/之三…；回傳唯一名稱
    // numericOnly=true 時跳過方位、直接用之二/之三（同一地標群去重用）
    function ensureUniqueName(base, usedSet, lat, lng, siblings, numericOnly) {
      const root = base.includes('風獅爺') ? base : base + '風獅爺';
      if (!usedSet.has(root)) { usedSet.add(root); return root; }
      if (!numericOnly) {
        const stem = root.replace(/風獅爺.*$/, '');
        const dirs = ['東', '西', '南', '北', '中'];
        for (const d of dirs) {
          const cand = stem + d + '風獅爺';
          if (!usedSet.has(cand)) { usedSet.add(cand); return cand; }
        }
      }
      let i = 2;
      while (usedSet.has(`${root}之${['', '', '二', '三', '四', '五', '六', '七', '八', '九'][i] || i}`)) i++;
      const num = ['二', '三', '四', '五', '六', '七', '八', '九'][i - 2] || i;
      const cand = `${root}之${num}`;
      usedSet.add(cand);
      return cand;
    }
    // 站牌名清理：「前厝三」→「前厝」、「成功二」→「成功」，括號附註保留
    function cleanStationKey(s) {
      return (s || '').replace(/[一二三四五六七八九\d]+$/, '').trim() || s;
    }
    function getUsedNames(excludeStopId) {
      const s = new Set();
      stopsData.forEach(st => { if (st.stop_id !== excludeStopId && st.name && !isPlaceholderName(st.name)) s.add(st.name); });
      return s;
    }
    function matchNearest(list, lat, lng, radiusM) {
      let best = null, bestD = Infinity;
      for (const e of list) {
        const d = haversineM(lat, lng, e.lat, e.lng);
        if (d <= radiusM && d < bestD) { bestD = d; best = e; }
      }
      return best ? { entry: best, key: best.key, distM: Math.round(bestD) } : null;
    }
    // 同一輪內已有站用過最近地標時，改取次近未用過者（避免硬加後綴）
    function matchNearestUnused(list, lat, lng, radiusM, usedSet, baseOf) {
      const cands = [];
      for (const e of list) {
        const d = haversineM(lat, lng, e.lat, e.lng);
        if (d <= radiusM) {
          const base = baseOf(e);
          const root = base.includes('風獅爺') ? base : base + '風獅爺';
          if (!usedSet.has(root)) cands.push({ entry: e, key: e.key, distM: Math.round(d) });
        }
      }
      cands.sort((a, b) => a.distM - b.distM);
      return cands[0] || null;
    }
    async function queryOverpassWindLion(lat, lng, radiusM) {
      const q = `[out:json][timeout:${NAMING_CONFIG.overpassTimeoutSec}];(node["name"~"風獅|石獅爺|風獅爺",i](around:${radiusM},${lat},${lng});way["name"~"風獅|石獅爺|風獅爺",i](around:${radiusM},${lat},${lng});relation["name"~"風獅|石獅爺|風獅爺",i](around:${radiusM},${lat},${lng}););out center 20;`;
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(q)
      });
      if (!res.ok) throw new Error('Overpass ' + res.status);
      const j = await res.json();
      const hits = (j.elements || []).map(e => e.tags && e.tags.name).filter(Boolean);
      return [...new Set(hits)];
    }
    async function reverseGeocode(lat, lng) {
      const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=zh-TW&zoom=18`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('Nominatim ' + res.status);
      const j = await res.json();
      return j.address || {};
    }
    function pickPlaceName(addr) {
      for (const k of ['hamlet', 'village', 'suburb', 'neighbourhood', 'quarter', 'city_district', 'town'])
        if (addr[k]) return addr[k];
      return '';
    }
    // 五輪命名主函式：回傳 { name, round, source }，保證與 usedSet 不重複
    // R1 風獅爺地標 > R2 視覺確認(人工) > R3 其他地標 > R4 站牌/地名 > R5 視覺特徵(人工)
    async function resolveName5Rounds(stop, usedSet) {
      // R1: 名稱有風獅爺的地標（內嵌已驗證表 + Overpass 即時查詢補強；同群去重用之二/三）
      const wl = matchNearest(WIND_LION_SPOTS, stop.lat, stop.lng, NAMING_CONFIG.round1RadiusM);
      if (wl) return { name: ensureUniqueName(wl.entry.name, usedSet, null, null, null, true), round: 1, source: `風獅爺地標・${wl.entry.key}(${wl.distM}m)` };
      try {
        const hits = await queryOverpassWindLion(stop.lat, stop.lng, NAMING_CONFIG.round1RadiusM);
        if (hits.length) {
          const short = cleanBase(hits[0].replace(/風獅爺.*$/, '').replace(/.*[鎮鄉](.+)/, '$1')) || hits[0];
          return { name: ensureUniqueName(short.replace(/風獅爺.*$/, '') || hits[0], usedSet), round: 1, source: `OSM地標・${hits[0]}` };
        }
      } catch (e) { console.warn('R1 overpass略過', e); }
      // R2: 視覺確認有風獅爺的名稱或地名（使用者看照片後輸入，存 stop.visual_confirmed）
      if (stop.visual_confirmed) {
        return { name: ensureUniqueName(stop.visual_confirmed, usedSet), round: 2, source: `視覺確認・${stop.visual_confirmed}` };
      }
      // R3: 其他地標（廟宇/洋樓/湖等已驗證表；最近者已用則取次近未用者）
      const lmU = matchNearestUnused(OTHER_LANDMARKS, stop.lat, stop.lng, NAMING_CONFIG.round3RadiusM, usedSet, e => e.key);
      if (lmU) return { name: ensureUniqueName(lmU.key, usedSet), round: 3, source: `其他地標・${lmU.key}(${lmU.distM}m)` };
      const lm = matchNearest(OTHER_LANDMARKS, stop.lat, stop.lng, NAMING_CONFIG.round3RadiusM);
      if (lm) return { name: ensureUniqueName(lm.key, usedSet), round: 3, source: `其他地標・${lm.key}(${lm.distM}m去重)` };
      // R4: 附近站牌名（300m內；已用則取次近未用者）或地名（內嵌 place，缺時才即時逆地理編碼）
      const bsU = matchNearestUnused(NEARBY_BUS_STOPS, stop.lat, stop.lng, NAMING_CONFIG.round4StopRadiusM, usedSet, e => cleanStationKey(e.key));
      if (bsU) {
        const base = cleanStationKey(bsU.key);
        return { name: ensureUniqueName(base, usedSet), round: 4, source: `站牌名・${bsU.key}(${bsU.distM}m)` };
      }
      let place = stop.place || '';
      if (!place) {
        try {
          const addr = await reverseGeocode(stop.lat, stop.lng);
          place = cleanBase(pickPlaceName(addr));
        } catch (e) { console.warn('逆地理編碼失敗', e); }
      }
      if (place) return { name: ensureUniqueName(place, usedSet), round: 4, source: `地名・${place}` };
      // R5: 視覺其他特徵（需人工看照片確認）
      const visual = prompt(`【${stop.stop_number}】前四輪皆無可用名稱。\n請目視該站照片，輸入適合的特徵命名（例：石雕坐姿／紅披風／廟口）：`, stop.visual_feature || '石雕立姿');
      if (visual === null) throw new Error('使用者取消 R5 命名');
      stop.visual_feature = cleanBase(visual) || '待辨識';
      saveVisualOverrides();
      return { name: ensureUniqueName(stop.visual_feature, usedSet), round: 5, source: '視覺特徵・人工目視' };
    }
    // R2/R5 視覺確認 UI：使用者看彈窗照片後輸入，結果存 localStorage
    function visualConfirm(stopId, kind) {
      const stop = stopsData.find(s => s.stop_id === stopId);
      if (!stop) return;
      if (kind === 'name') {
        const v = prompt(`【${stop.stop_number} ${stop.name}】\n請目視上方照片：風獅爺本體或說明牌上有無名稱或地名？\n有則輸入（將列為第二輪命名），無則按取消：`, stop.visual_confirmed || '');
        if (v === null || !v.trim()) return;
        stop.visual_confirmed = cleanBase(v.trim());
        saveVisualOverrides();
        const used = getUsedNames(stopId);
        stop.name = ensureUniqueName(stop.visual_confirmed, used);
        stop.naming_round = 2;
        stop.naming_source = `視覺確認・${stop.visual_confirmed}`;
      } else {
        const v = prompt(`【${stop.stop_number} ${stop.name}】\n請目視上方照片，輸入其他適合的視覺特徵（例：紅披風石獅／坐姿陶獅）：`, stop.visual_feature || '');
        if (v === null || !v.trim()) return;
        stop.visual_feature = cleanBase(v.trim());
        saveVisualOverrides();
        const used = getUsedNames(stopId);
        stop.name = ensureUniqueName(stop.visual_feature, used);
        stop.naming_round = 5;
        stop.naming_source = '視覺特徵・人工目視';
      }
      renderMarkers(); renderList();
      alert(`已更新為【${stop.name}】（${ROUND_LABEL[stop.naming_round]}），全站唯一性：${checkNamesUnique().ok ? '通過' : '有重複！'}`);
    }
    function saveVisualOverrides() {
      try {
        const o = {};
        stopsData.forEach(s => {
          if (s.visual_confirmed || s.visual_feature) o[s.stop_id] = { vc: s.visual_confirmed || '', vf: s.visual_feature || '' };
        });
        localStorage.setItem(VISUAL_STORE_KEY, JSON.stringify(o));
      } catch (e) { console.warn('localStorage 寫入失敗', e); }
    }
    function loadVisualOverrides() {
      try {
        const o = JSON.parse(localStorage.getItem(VISUAL_STORE_KEY) || '{}');
        let applied = 0;
        const used = getUsedNames(null);
        // 先移除已套用的 R2/R5 舊名再重算，避免殘留
        stopsData.forEach(s => {
          const rec = o[s.stop_id];
          if (!rec) return;
          s.visual_confirmed = rec.vc || undefined;
          s.visual_feature = rec.vf || undefined;
          if (rec.vc) {
            used.delete(s.name);
            s.name = ensureUniqueName(rec.vc, used);
            s.naming_round = 2;
            s.naming_source = `視覺確認・${rec.vc}`;
            applied++;
          }
        });
        if (applied) console.log(`已還原 ${applied} 站視覺確認命名`);
      } catch (e) { console.warn('localStorage 讀取失敗', e); }
    }
    async function autoNamePlaceholders() {
      const targets = stopsData.filter(s => isPlaceholderName(s.name) && s.lat && s.lng);
      if (!targets.length) { alert('目前沒有「第 XX 站」佔位名稱，30 站皆已命名且無重複。'); return; }
      if (!confirm(`將依五輪規則為 ${targets.length} 站自動命名（風獅爺地標→視覺確認→其他地標→站牌地名→視覺特徵），並保證不重複。繼續？`)) return;
      const used = getUsedNames(null);
      let n = 0;
      for (const st of targets) {
        try {
          const r = await resolveName5Rounds(st, used);
          st.name = r.name; st.naming_round = r.round; st.naming_source = r.source; n++;
          await new Promise(res => setTimeout(res, 1100)); // 遵守 Nominatim 1req/s
        } catch (e) { console.error(st.stop_number, e); }
      }
      renderMarkers(); renderList();
      alert(`已完成 ${n} 站自動命名，全站名稱唯一性檢查：${checkNamesUnique().ok ? '通過' : '有重複！'}`);
    }
    // 全部重新命名：依五輪規則重算 30 站（含已命名站；R2 視覺確認保留）
    async function renameAllStops() {
      if (!confirm('將依新五輪規則（風獅爺地標→視覺確認→其他地標→站牌地名→視覺特徵）為全部 30 站重新命名，R2 視覺確認會保留。繼續？')) return;
      const used = new Set();
      let n = 0;
      for (const st of [...stopsData].sort((a, b) => a.stop_id - b.stop_id)) {
        try {
          const r = await resolveName5Rounds(st, used);
          st.name = r.name; st.naming_round = r.round; st.naming_source = r.source; n++;
          await new Promise(res => setTimeout(res, 1100));
        } catch (e) { console.error(st.stop_number, e); used.add(st.name); }
      }
      renderMarkers(); renderList();
      alert(`已重算 ${n} 站，全站唯一性：${checkNamesUnique().ok ? '通過' : '有重複！'}`);
    }
    function checkNamesUnique() {
      const seen = new Map(), dup = [];
      stopsData.forEach(s => { if (seen.has(s.name)) dup.push(s.name); else seen.set(s.name, s.stop_id); });

    let currentFilter = 'ALL';

        // 根據站點編號 (1~30) 計算連續彩虹漸層色
    function getRainbowColor(num, total = 30) {
      const hue = Math.round(((num - 1) / (total - 1)) * 315);
      return `hsl(${hue}, 88%, 45%)`;

    function createNumberedIcon(num) {

        iconSize: [32, 32],
        iconAnchor: [16, 32],

    }

              ${galleryHtml}
              <div class="popup-actions" style="margin-bottom:5px;">
                <button class="popup-link" style="border:none;cursor:pointer;background:#7c3aed;" onclick="visualConfirm(${stop.stop_id},'name')" title="看照片：風獅爺本體或說明牌上的名稱/地名 → 第二輪">
                  <i class="fa-solid fa-eye"></i> 視覺確認名稱(R2)
                </button>
                <button class="popup-link" style="border:none;cursor:pointer;background:#64748b;" onclick="visualConfirm(${stop.stop_id},'feature')" title="看照片：其他視覺特徵 → 第五輪">
                  <i class="fa-solid fa-palette"></i> 特徵命名(R5)
                </button>
              </div>
              <div class="popup-actions">
                <a href="https://www.google.com/maps/search/?api=1&query=${stop.lat},${stop.lng}" target="_blank" class="popup-link" style="background:#ea4335;" title="在 Google Maps 查看此座標地標">
                  <i class="fa-solid fa-map-location-dot"></i> Google Maps
                </a>
                <a href="https://www.openstreetmap.org/?mlat=${stop.lat}&mlon=${stop.lng}#map=18/${stop.lat}/${stop.lng}" target="_blank" class="popup-link" style="background:#059669;" title="在 OpenStreetMap 查看此座標地標">
                  <i class="fa-regular fa-map"></i> OSM
                </a>
                <a href="${firstPhoto.viewUrl}" target="_blank" class="popup-link" title="開啟 Google Drive 雲端原圖">
                  <i class="fa-brands fa-google-drive"></i> 原圖
                </a>
              </div>
            </div>
          `;

          marker.bindPopup(popupContent, { maxWidth: 300 });
          marker.on('click', () => highlightCard(stop.stop_id));
          markers[stop.stop_id] = marker;
        }
      });
    }

    function renderList() {
      const listEl = document.getElementById('stopsList');
      listEl.innerHTML = '';
      const filtered = stopsData.filter(s => currentFilter === 'ALL' || s.date === currentFilter);

      filtered.forEach(stop => {
        const card = document.createElement('div');
        card.className = `stop-card ${stop.lat ? 'has-pin' : ''}`;
        card.id = `stop-card-${stop.stop_id}`;
        card.onclick = () => focusStop(stop);

        const firstPhoto = stop.photos[0];
        const thumbUrl = firstPhoto.localUrl || firstPhoto.thumbnailUrl;

        const badgeHtml = stop.lat 
          ? `<span class="badge-status status-pinned"><i class="fa-solid fa-location-dot"></i> 已定位</span>`
          : `<span class="badge-status status-wait"><i class="fa-regular fa-clock"></i> 待定位</span>`;

        card.innerHTML = `
          <div class="stop-num-badge" style="background: ${getRainbowColor(stop.stop_id)};">${stop.stop_number}</div>
          <div class="stop-thumb-box">
            <img class="stop-thumb" src="${thumbUrl}" onerror="this.src='${svgFallback}'" alt="thumb">
            <div class="stop-photo-count"><i class="fa-solid fa-images"></i> ${stop.photo_count}</div>
          </div>
          <div class="stop-details">
            <div class="stop-name">${stop.name}</div>
            <div class="stop-time"><i class="fa-regular fa-clock"></i> ${stop.date} ${stop.time_display}</div>
            <div class="stop-loc">${stop.lat ? '<i class="fa-solid fa-map-pin"></i> ' + stop.location : badgeHtml}</div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function focusStop(stop) {
      highlightCard(stop.stop_id);
      if (stop.lat && stop.lng && markers[stop.stop_id]) {
        map.flyTo([stop.lat, stop.lng], 16, { duration: 1 });
        markers[stop.stop_id].openPopup();
      } else {
        alert(`【${stop.stop_number} ${stop.name}】\n拍攝時間：${stop.date} ${stop.time_display}\n內含 ${stop.photo_count} 張相片。\n尚未載入 GPS 座標。請點擊上方按鈕選取照片資料夾，系統將讀取 EXIF 自動在地圖上插上旗標！`);
      }
    }

    function highlightCard(stopId) {
      document.querySelectorAll('.stop-card').forEach(c => {
        c.classList.remove('active');
        c.style.borderColor = '';
        c.style.backgroundColor = '';
      });
      const card = document.getElementById(`stop-card-${stopId}`);
      if (card) {
        const color = getRainbowColor(stopId);
        card.classList.add('active');
        card.style.borderColor = color;
        card.style.backgroundColor = color + '0d';
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMarkers();
      renderList();
    }

    function updateCounts() {
      let pinnedCount = 0;
      stopsData.forEach(s => { if (s.lat && s.lng) pinnedCount++; });
      document.getElementById('pinned-count').innerText = pinnedCount;
    }

    // 自動讀取照片 EXIF 並自動將相近的相片整合至該站旗標
    async function handleFiles(files) {
      let matchedCount = 0;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        for (let stop of stopsData) {
          const photoMatch = stop.photos.find(p => p.title === file.name);
          if (photoMatch) {
            photoMatch.localUrl = URL.createObjectURL(file);
            try {
              const exif = await exifr.parse(file, ['latitude', 'longitude', 'DateTimeOriginal']);
              if (exif && exif.latitude && exif.longitude) {
                stop.lat = exif.latitude;
                stop.lng = exif.longitude;
                stop.location = `座標: ${exif.latitude.toFixed(5)}, ${exif.longitude.toFixed(5)}`;
              }
            } catch (e) {
              console.error(e);
            }
            matchedCount++;
          }
        }
      }
      alert(`已成功匹配 ${matchedCount} 張相片！相近時間與 GPS 的照片已自動整合成同一個風獅爺標籤，並按時序完成編號。`);
      renderMarkers();
      renderList();
      updateCounts();

      const group = Object.values(markers);
      if (group.length > 0) {
        const fg = L.featureGroup(group);
        map.fitBounds(fg.getBounds().pad(0.1));
      }
    }

    function exportGeoJSON() {
      const geojson = {
        type: "FeatureCollection",
        features: stopsData.filter(s => s.lat && s.lng).map(s => ({
          type: "Feature",
          geometry: { type: "Point", coordinates: [s.lng, s.lat] },
          properties: {
            stop_id: s.stop_id,
            stop_number: s.stop_number,
            name: s.name,
            date: s.date,
            time_display: s.time_display,
            location: s.location,
            naming_round: s.naming_round,
            naming_source: s.naming_source,
            place: s.place,
            visual_confirmed: s.visual_confirmed,
            visual_feature: s.visual_feature,
            photo_count: s.photo_count,
            photos: s.photos.map(p => ({ title: p.title, time: p.time, viewUrl: p.viewUrl }))
          }
        }))
      };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kinmen_wind_lion_stops.geojson';
      a.click();
    }

    const dropArea = document.getElementById('dropArea');
    const dropOverlay = document.getElementById('dropOverlay');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.style.display = 'flex'; });
    dropOverlay.addEventListener('dragleave', (e) => { dropOverlay.style.display = 'none'; });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.style.display = 'none';
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFiles(e.dataTransfer.files);
      }
    });

    window.onload = initMap;
  </script>
</body>
</html>
